[workspace]
resolver = "2"
members = [
    "foverin",
    "foverin-common",
    "foverin-ebpf",
]
default-members = ["foverin", "foverin-common"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["hocestnonsatis"]
repository = "https://github.com/hocestnonsatis/foverin"
homepage = "https://github.com/hocestnonsatis/foverin"
documentation = "https://github.com/hocestnonsatis/foverin#readme"
readme = "README.md"
description = "Autonomous Linux workload optimizer — eBPF sensing, Candle nano-NN classification, sysfs/cgroup actuation"
keywords = ["ebpf", "linux", "cgroup", "observability", "ratatui"]
categories = ["os", "command-line-utilities", "asynchronous"]

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
candle-core = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std"] }
crossterm = { version = "0.28", default-features = false, features = ["event-stream"] }
env_logger = { version = "0.11.5", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tokio = { version = "1.40.0", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.foverin-ebpf]
debug = 2
codegen-units = 1
strip = false
