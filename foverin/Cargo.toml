[package]
name = "foverin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Foverin userspace library, daemon, CLI, and Forge trainer"
keywords.workspace = true
categories.workspace = true

[dependencies]
foverin-common = { path = "../foverin-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
crossterm = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
    "sync",
    "io-util",
] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact dependency, but
# it's not possible to tell cargo to use `-Z build-std` to build it. We cargo-in-cargo in the build
# script to build this, but we want to teach cargo about the dependency so that cache invalidation
# works properly.
#
# Note also that https://github.com/rust-lang/cargo/issues/10593 occurs when `target = ...` is added
# to an artifact dependency; it seems possible to work around that by setting `resolver = "1"` in
# Cargo.toml in the workspace root.
#
# Finally note that *any* usage of `artifact = ...` in *any* Cargo.toml in the workspace breaks
# workflows with stable cargo; stable cargo outright refuses to load manifests that use unstable
# features.
foverin-ebpf = { path = "../foverin-ebpf" }

[lib]
name = "foverin"
path = "src/lib.rs"

[[bin]]
name = "foverin-daemon"
path = "src/bin/foverin-daemon.rs"

[[bin]]
name = "foverin-cli"
path = "src/bin/foverin-cli.rs"

[[bin]]
name = "forge"
path = "src/bin/forge.rs"
